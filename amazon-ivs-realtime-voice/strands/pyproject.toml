[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "amazon-ivs-strands-sample"
version = "0.1.0"
description = "Amazon IVS Real-Time adapters for Strands BidiAgent and Nova Sonic"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiortc==1.15.0",
    "numpy>=1.26,<3",
    "requests>=2.32,<3",
    "strands-agents[bidi]==1.58.0",
]

[project.scripts]
amazon-ivs-strands = "ivs_strands.app:main"

[tool.hatch.build.targets.wheel]
packages = ["ivs_strands"]
